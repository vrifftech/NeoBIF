name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '7 7 * * 1'
  repository_dispatch:
    types: [neoshared-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux AppImage (x86-64, Debian 12)
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 90

    steps:
      - name: Install AppImage build dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            file \
            git \
            ninja-build \
            pkg-config \
            python3 \
            tar \
            unzip \
            zip \
            libwxgtk3.2-dev \
            zlib1g-dev

      - name: Check out NeoBIF
        uses: actions/checkout@v7
        with:
          path: tool
          persist-credentials: false

      - name: Check out neoshared
        uses: actions/checkout@v7
        with:
          repository: vrifftech/neoshared
          ref: main
          path: neoshared
          persist-credentials: false

      - name: Build AppImage
        working-directory: tool
        run: |
          bash ./scripts/build-linux-appimage.sh \
            --neoshared-root ../neoshared \
            --jobs 2 \
            --clean

      - name: Verify AppImage checksum
        run: |
          cd tool/dist
          sha256sum -c NeoBIF-*-linux-x86_64.AppImage.sha256

      - name: Upload Linux AppImage
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: NeoBIF-linux-x86_64-${{ github.sha }}
          path: |
            tool/dist/NeoBIF-*-linux-x86_64.AppImage
            tool/dist/NeoBIF-*-linux-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    name: Windows (Visual Studio 2026 + wxWidgets 3.3.3)
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    env:
      VCPKG_BINARY_SOURCES: clear;default,readwrite

    steps:
      - name: Check out NeoBIF
        uses: actions/checkout@v7
        with:
          path: tool
          persist-credentials: false

      - name: Check out neoshared
        uses: actions/checkout@v7
        with:
          repository: vrifftech/neoshared
          ref: main
          path: neoshared
          persist-credentials: false

      - name: Install wxWidgets 3.3.3
        shell: pwsh
        run: |
          & .\neoshared\scripts\install-wxwidgets.ps1 `
            -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT `
            -Triplet x64-windows-static `
            -CleanAfterBuild

      - name: Configure and build
        working-directory: tool
        shell: pwsh
        run: |
          .\scripts\build.ps1 `
            -BuildDir build `
            -BuildType Release `
            -Wx ON `
            -RequireWx ON `
            -Cli ON `
            -MinimalRelease OFF `
            -Generator 'Visual Studio 18 2026' `
            -Platform x64 `
            -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT `
            -VcpkgTriplet x64-windows-static `
            -Parallel 2 `
            -Clean

      - name: Stage install tree
        shell: pwsh
        run: cmake --install tool/build --config Release --prefix tool/stage

      - name: Upload Windows executable
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: NeoBIF-windows-x86_64-${{ github.sha }}
          path: tool/stage/
          if-no-files-found: error
          retention-days: 14
