name: WebAssembly / GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [neoshared-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out NeoBIF
        uses: actions/checkout@v7
        with:
          path: tool
          persist-credentials: false

      - name: Check out neoshared
        uses: actions/checkout@v7
        with:
          repository: vrifftech/neoshared
          ref: main
          path: neoshared
          persist-credentials: false

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential autoconf automake libtool libtool-bin make \
            ninja-build cmake python3 python3-venv git pkg-config

      - name: Restore Emscripten and wxWidgets-WASM cache
        uses: actions/cache@v6
        with:
          path: |
            .neo-wasm-deps/emsdk
            .neo-wasm-deps/wxwidgets-wasm
            .neo-wasm-deps/wxwidgets-wasm-build
            .neo-wasm-deps/neo-wasm-versions.env
          key: wasm-${{ runner.os }}-${{ hashFiles('neoshared/wasm/versions.env', 'neoshared/cmake/NeoWasm.cmake', 'neoshared/scripts/setup-wasm.sh', 'neoshared/scripts/build-wx-wasm.sh', 'neoshared/wasm/versions.env', 'neoshared/wasm/wx-no-pthreads-compat.h', 'neoshared/scripts/wasm-config-sub-wrapper.sh', 'neoshared/scripts/wasm-autom4te-wrapper.sh') }}

      - name: Build browser application
        working-directory: tool
        run: |
          bash ./scripts/build-wasm.sh \
            --deps-root ../.neo-wasm-deps \
            --jobs 2 \
            --clean

      - name: Validate static site
        run: |
          test -f tool/dist-wasm/index.html
          test -f tool/dist-wasm/neobif.js
          test -f tool/dist-wasm/neobif.wasm
          grep -q 'NeoBIF' tool/dist-wasm/index.html
          node --check neoshared/wasm/neo-pre.js

      - name: Upload WebAssembly build
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: NeoBIF-web-wasm-${{ github.sha }}
          path: tool/dist-wasm/
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: tool/dist-wasm

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
