name: WebAssembly / GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [neoshared-updated]
  workflow_dispatch:
    inputs:
      neoshared_ref:
        description: neoshared branch, tag, or commit SHA (blank uses NEOSHARED_REF or main)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEOSHARED_REF: ${{ github.event.client_payload.neoshared_ref || inputs.neoshared_ref || vars.NEOSHARED_REF || 'main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out NeoBIF
        uses: actions/checkout@v7
        with:
          path: tool
          persist-credentials: false

      - name: Resolve neoshared revision
        id: neoshared_ref
        shell: bash
        run: |
          set -euo pipefail
          requested="${NEOSHARED_REF:-main}"
          if [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]]; then
            resolved="${requested,,}"
          else
            remote="https://github.com/vrifftech/neoshared.git"
            resolved=""
            refspecs=(
              "refs/heads/$requested"
              "refs/tags/$requested^{}"
              "refs/tags/$requested"
              "$requested"
            )
            for refspec in "${refspecs[@]}"; do
              candidate="$(git ls-remote "$remote" "$refspec" | awk 'NR == 1 { print tolower($1); exit }')"
              if [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
                resolved="$candidate"
                break
              fi
            done
          fi
          if [[ ! "$resolved" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to resolve neoshared reference '$requested' to a commit SHA."
            exit 1
          fi
          echo "Resolved neoshared '$requested' to $resolved"
          echo "sha=$resolved" >> "$GITHUB_OUTPUT"

      - name: Check out neoshared
        uses: actions/checkout@v7
        with:
          repository: vrifftech/neoshared
          ref: ${{ steps.neoshared_ref.outputs.sha }}
          path: neoshared
          persist-credentials: false

      - name: Verify resolved neoshared revision
        shell: bash
        run: |
          actual="$(git -C neoshared rev-parse HEAD)"
          expected="${{ steps.neoshared_ref.outputs.sha }}"
          test "$actual" = "$expected" || {
            echo "::error::Expected neoshared $expected, got $actual"
            exit 1
          }


      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential autoconf automake libtool libtool-bin make \
            ninja-build cmake python3 python3-venv git pkg-config

      - name: Restore Emscripten and wxWidgets-WASM cache
        uses: actions/cache@v6
        with:
          path: |
            .neo-wasm-deps/emsdk
            .neo-wasm-deps/wxwidgets-wasm
            .neo-wasm-deps/wxwidgets-wasm-build
            .neo-wasm-deps/neo-wasm-versions.env
          key: wasm-${{ runner.os }}-${{ hashFiles('neoshared/wasm/versions.env', 'neoshared/cmake/NeoWasm.cmake', 'neoshared/scripts/setup-wasm.sh', 'neoshared/scripts/build-wx-wasm.sh', 'neoshared/scripts/patch-wx-wasm-no-pthreads.py', 'neoshared/scripts/wasm-config-sub-wrapper.sh', 'neoshared/scripts/wasm-autom4te-wrapper.sh') }}

      - name: Build browser application
        working-directory: tool
        run: |
          bash ./scripts/build-wasm.sh \
            --neoshared-root ../neoshared \
            --deps-root ../.neo-wasm-deps \
            --jobs 2 \
            --clean

      - name: Validate static site
        run: |
          test -f tool/dist-wasm/index.html
          test -f tool/dist-wasm/neobif.js
          test -f tool/dist-wasm/neobif.wasm
          grep -q 'NeoBIF' tool/dist-wasm/index.html
          node --check neoshared/wasm/neo-pre.js

      - name: Configure GitHub Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: tool/dist-wasm

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
