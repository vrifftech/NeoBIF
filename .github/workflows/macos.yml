name: macOS

on:
  push:
  pull_request:
  repository_dispatch:
    types: [neoshared-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: '15.0'

jobs:
  macos:
    name: macOS 15 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'

    steps:
      - name: Check out NeoBIF
        uses: actions/checkout@v7
        with:
          path: tool
          persist-credentials: false

      - name: Check out neoshared
        uses: actions/checkout@v7
        with:
          repository: vrifftech/neoshared
          ref: main
          path: neoshared
          persist-credentials: false

      - name: Validate native runner
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          sw_vers
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew install cmake ninja wxwidgets
          WX_PREFIX="$(brew --prefix wxwidgets)"
          echo "$WX_PREFIX/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$WX_PREFIX" >> "$GITHUB_ENV"
          "$WX_PREFIX/bin/wx-config" --version

      - name: Build and package NeoBIF
        working-directory: tool
        run: |
          bash ./scripts/build-macos.sh \
            --arch "${{ matrix.arch }}" \
            --deployment-target "$MACOSX_DEPLOYMENT_TARGET" \
            --jobs 2 \
            --clean

      - name: Verify package checksum
        run: |
          cd tool/dist
          shasum -a 256 -c NeoBIF-*-macos-${{ matrix.arch }}.zip.sha256
          unzip -l NeoBIF-*-macos-${{ matrix.arch }}.zip

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: NeoBIF-macos-${{ matrix.arch }}-${{ github.sha }}
          path: |
            tool/dist/NeoBIF-*-macos-${{ matrix.arch }}.zip
            tool/dist/NeoBIF-*-macos-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
