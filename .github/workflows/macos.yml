name: macOS

on:
  push:
  pull_request:
  repository_dispatch:
    types: [neoshared-updated]
  workflow_dispatch:
    inputs:
      neoshared_ref:
        description: neoshared branch, tag, or commit SHA (blank uses NEOSHARED_REF or main)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEOSHARED_REF: ${{ github.event.client_payload.neoshared_ref || inputs.neoshared_ref || vars.NEOSHARED_REF || 'main' }}
  MACOSX_DEPLOYMENT_TARGET: '15.0'

jobs:
  macos:
    name: macOS 15 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'

    steps:
      - name: Check out NeoBIF
        uses: actions/checkout@v7
        with:
          path: tool
          persist-credentials: false

      - name: Resolve neoshared revision
        id: neoshared_ref
        shell: bash
        run: |
          set -euo pipefail
          requested="${NEOSHARED_REF:-main}"
          if [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]]; then
            resolved="${requested,,}"
          else
            remote="https://github.com/vrifftech/neoshared.git"
            resolved=""
            refspecs=(
              "refs/heads/$requested"
              "refs/tags/$requested^{}"
              "refs/tags/$requested"
              "$requested"
            )
            for refspec in "${refspecs[@]}"; do
              candidate="$(git ls-remote "$remote" "$refspec" | awk 'NR == 1 { print tolower($1); exit }')"
              if [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
                resolved="$candidate"
                break
              fi
            done
          fi
          if [[ ! "$resolved" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to resolve neoshared reference '$requested' to a commit SHA."
            exit 1
          fi
          echo "Resolved neoshared '$requested' to $resolved"
          echo "sha=$resolved" >> "$GITHUB_OUTPUT"

      - name: Check out neoshared
        uses: actions/checkout@v7
        with:
          repository: vrifftech/neoshared
          ref: ${{ steps.neoshared_ref.outputs.sha }}
          path: neoshared
          persist-credentials: false

      - name: Verify resolved neoshared revision
        shell: bash
        run: |
          actual="$(git -C neoshared rev-parse HEAD)"
          expected="${{ steps.neoshared_ref.outputs.sha }}"
          test "$actual" = "$expected" || {
            echo "::error::Expected neoshared $expected, got $actual"
            exit 1
          }


      - name: Validate native runner
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          sw_vers
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew install cmake ninja wxwidgets
          WX_PREFIX="$(brew --prefix wxwidgets)"
          echo "$WX_PREFIX/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$WX_PREFIX" >> "$GITHUB_ENV"
          "$WX_PREFIX/bin/wx-config" --version

      - name: Build and package NeoBIF
        working-directory: tool
        run: |
          bash ./scripts/build-macos.sh \
            --arch "${{ matrix.arch }}" \
            --deployment-target "$MACOSX_DEPLOYMENT_TARGET" \
            --neoshared-root ../neoshared \
            --jobs 2 \
            --clean

      - name: Verify package checksum
        run: |
          cd tool/dist
          shasum -a 256 -c NeoBIF-*-macos-${{ matrix.arch }}.zip.sha256
          unzip -l NeoBIF-*-macos-${{ matrix.arch }}.zip

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: NeoBIF-macos-${{ matrix.arch }}-${{ github.sha }}
          path: |
            tool/dist/NeoBIF-*-macos-${{ matrix.arch }}.zip
            tool/dist/NeoBIF-*-macos-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
